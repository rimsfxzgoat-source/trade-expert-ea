name: Build Android APK
on: {push: {branches: [main]}, workflow_dispatch: {}}
permissions: {contents: write}
jobs: {build: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-java@v4, with: {distribution: temurin, java-version: 17}}, {uses: android-actions/setup-android@v3}, {uses: gradle/actions/setup-gradle@v4, with: {gradle-version: 8.9}}, {name: Unzip and build, run: "ZIP=$(ls TradeExpert*.zip | sort -V | tail -1) && mkdir src && unzip -q \"$ZIP\" -d src && cd src/*/ && gradle assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/TradeExpert.apk"}, {uses: softprops/action-gh-release@v2, with: {tag_name: "v${{ github.run_number }}", name: "Trade Expert v${{ github.run_number }}", files: TradeExpert.apk, make_latest: true}}]}}
